[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    ai:          LLM / AI evaluation tests
    api:         API-level tests
    ui:          Playwright browser UI tests
    security:    Security and injection tests
    performance: Latency, throughput, and token-efficiency tests

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html

# ── asyncio ───────────────────────────────────────────────────────────────────
asyncio_mode = auto

# ── Logging ───────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s — %(message)s
log_date_format = %H:%M:%S
